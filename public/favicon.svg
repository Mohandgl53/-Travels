<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Deep Royal Sapphire Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Warm Golden Highway Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Cyan Streamline Glow -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Rounded Luxury Emblem Frame -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#shieldGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="2" filter="url(#shadow)" />

  <!-- Inner Subtle Accent Border -->
  <rect x="10" y="10" width="100" height="100" rx="22" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.65" />

  <!-- Aerodynamic Highway Ribbon Horizon -->
  <path d="M 16,84 C 36,94 84,94 104,84 C 92,76 60,78 16,84 Z" fill="url(#goldGrad)" opacity="0.35" />
  <path d="M 20,86 C 45,92 75,92 100,86" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Sleek Luxury Coach Silhouette Streamline -->
  <path d="M 28,68 L 74,68 C 82,68 88,71 92,76 L 90,78 C 86,75 80,73 72,73 L 28,73 Z" fill="url(#cyanGlow)" opacity="0.9" />
  <!-- Coach Windows -->
  <rect x="34" y="62" width="10" height="4" rx="1.5" fill="#ffffff" opacity="0.9" />
  <rect x="47" y="62" width="10" height="4" rx="1.5" fill="#ffffff" opacity="0.9" />
  <rect x="60" y="62" width="10" height="4" rx="1.5" fill="#ffffff" opacity="0.9" />
  <path d="M 73,62 L 81,62 C 84,62 86,63.5 87,66 L 73,66 Z" fill="#ffffff" opacity="0.9" />

  <!-- Three Golden Stars at Apex -->
  <g fill="url(#goldGrad)" opacity="0.95">
    <!-- Center Star -->
    <path d="M 60,18 L 62,23 L 67,23 L 63,26 L 64.5,31 L 60,28 L 55.5,31 L 57,26 L 53,23 L 58,23 Z" />
    <!-- Left Star -->
    <path d="M 44,22 L 45.5,25.5 L 49.5,25.5 L 46.5,27.5 L 47.5,31 L 44,29 L 40.5,31 L 41.5,27.5 L 38.5,25.5 L 42.5,25.5 Z" transform="scale(0.85) translate(8, 3)" />
    <!-- Right Star -->
    <path d="M 76,22 L 77.5,25.5 L 81.5,25.5 L 78.5,27.5 L 79.5,31 L 76,29 L 72.5,31 L 73.5,27.5 L 70.5,25.5 L 74.5,25.5 Z" transform="scale(0.85) translate(14, 3)" />
  </g>

  <!-- Central Proud Tamil Branding Glyph "மா" -->
  <text x="60" y="55" font-family="'Noto Sans Tamil', 'Mukta Malar', sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" filter="url(#shadow)">
    மா
  </text>
</svg>
